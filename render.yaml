services:
  - type: web
    name: codealpha-project-management
    runtime: python
    region: oregon
    plan: starter
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: codealpha-project-management-db
          property: connectionString

databases:
  - name: codealpha-project-management-db
    region: oregon
    plan: basic-256mb
    databaseName: codealpha_project_management
    user: codealpha_project_management
